[package]
name = "maplecode-otel"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false
name = "maplecode_otel"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
bytes = { workspace = true }
maplecode-http-client = { workspace = true }
opentelemetry-http = "0.31.0"
chrono = { workspace = true }
maplecode-utils-absolute-path = { workspace = true }
maplecode-utils-stream-parser = { workspace = true }
maplecode-utils-string = { workspace = true }
maplecode-utils-process = { workspace = true }
maplecode-http-headers-helper = { workspace = true }
maplecode-api = { workspace = true }
maplecode-protocol = { workspace = true }
eventsource-stream = { workspace = true }
gethostname = { workspace = true }
opentelemetry = { workspace = true, features = ["logs", "metrics", "trace"] }
opentelemetry-appender-tracing = { workspace = true }
opentelemetry-otlp = { workspace = true, features = [
    "grpc-tonic",
    "http-proto",
    "http-json",
    "logs",
    "metrics",
    "trace",
    "reqwest-blocking-client",
    "reqwest-rustls",
    "tls",
    "tls-roots",
]}
opentelemetry-semantic-conventions = { workspace = true }
opentelemetry_sdk = { workspace = true, features = [
    "experimental_trace_batch_span_processor_with_async_runtime",
    "experimental_metrics_custom_reader",
    "logs",
    "metrics",
    "rt-tokio",
    "testing",
    "trace",
] }
http = { workspace = true }
os_info = { workspace = true }
reqwest = { workspace = true, features = ["blocking", "rustls-tls"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum_macros = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
opentelemetry_sdk = { workspace = true, features = [
    "experimental_metrics_custom_reader",
    "testing",
] }
pretty_assertions = { workspace = true }
rcgen = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
seccompiler = { workspace = true }
