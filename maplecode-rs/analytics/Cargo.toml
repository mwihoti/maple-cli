[package]
edition.workspace = true
license.workspace = true
name = "maplecode-analytics"
version.workspace = true

[lib]
doctest = false
name = "maplecode_analytics"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
maplecode-features = { workspace = true }
maplecode-app-server-protocol = { workspace = true }
maplecode-git-utils = { workspace = true }
maplecode-http-client = { workspace = true }
maplecode-runtime-agent-instance = { workspace = true }
maplecode-login = { workspace = true }
maplecode-model-provider = { workspace = true }
maplecode-plugin = { workspace = true }
maplecode-protocol = { workspace = true }
maplecode-state = { workspace = true }
maplecode-utils-path-uri = { workspace = true }
http = { workspace = true }
os_info = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha1 = { workspace = true }
tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
] }
tracing = { workspace = true, features = ["log"] }

[dev-dependencies]
maplecode-model-provider-info = { workspace = true }
wiremock = { workspace = true }
maplecode-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
