[package]
name = "maplecode-app-server-client"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "maplecode_app_server_client"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
maplecode-app-server = { workspace = true }
maplecode-app-server-protocol = { workspace = true }
maplecode-app-server-transport = { workspace = true }
maplecode-arg0 = { workspace = true }
maplecode-cloud-client = { path = "../cloud-client" }
maplecode-config = { workspace = true }
maplecode-login = { workspace = true }
maplecode-core = { workspace = true }
maplecode-exec-server = { workspace = true }
maplecode-feedback = { workspace = true }
maplecode-http-client = { workspace = true }
maplecode-protocol = { workspace = true }
maplecode-uds = { workspace = true }
maplecode-utils-absolute-path = { workspace = true }
maplecode-utils-rustls-provider = { workspace = true }
color-eyre = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
tokio-tungstenite = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
wiremock = { workspace = true }
