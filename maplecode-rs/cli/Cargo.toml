[package]
name = "maplecode-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"
default-run = "maplecode"

[[bin]]
name = "maplecode"
path = "src/main.rs"

[[bin]]
name = "logs_client"
path = "src/bin/logs_client.rs"

[[test]]
name = "app_server_daemon_package"
path = "tests/app_server_daemon/package.rs"

[lib]
name = "maplecode_cli"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
maplecode-utils-process = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
maplecode-app-server = { workspace = true }
maplecode-app-server-daemon = { workspace = true }
maplecode-app-server-protocol = { workspace = true }
maplecode-app-server-test-client = { workspace = true }
maplecode-arg0 = { workspace = true }
maplecode-build-info = { workspace = true }
maplecode-api = { workspace = true }
maplecode-chatgpt = { workspace = true }
maplecode-cloud-config = { workspace = true }
maplecode-cloud-tasks = { path = "../cloud-tasks" }
maplecode-utils-cli = { workspace = true }
maplecode-config = { workspace = true }
maplecode-core = { workspace = true }
maplecode-core-plugins = { workspace = true }
maplecode-history = { workspace = true }
maplecode-home = { workspace = true }
maplecode-http-client = { workspace = true }
maplecode-exec = { workspace = true }
maplecode-exec-server = { workspace = true }
maplecode-exec-server-cli = { workspace = true }
maplecode-execpolicy = { workspace = true }
maplecode-extension-api = { workspace = true }
maplecode-features = { workspace = true }
maplecode-multi-env-copy-file = { workspace = true }
maplecode-git-attribution = { workspace = true }
maplecode-git-utils = { workspace = true }
maplecode-install-context = { workspace = true }
maplecode-login = { workspace = true }
maplecode-memories-write = { workspace = true }
maplecode-mcp = { workspace = true }
maplecode-model-provider = { workspace = true }
maplecode-model-provider-info = { workspace = true }
maplecode-keyring-store = { workspace = true }
maplecode-models-manager = { workspace = true }
maplecode-plugin = { workspace = true }
maplecode-protocol = { workspace = true }
maplecode-responses-api-proxy = { workspace = true }
maplecode-tcp-tunnel = { workspace = true }
maplecode-rmcp-client = { workspace = true }
maplecode-rollout = { workspace = true }
maplecode-rollout-trace = { workspace = true }
maplecode-sandboxing = { workspace = true }
maplecode-skills-extension = { workspace = true }
maplecode-state = { workspace = true }
maplecode-stdio-to-uds = { workspace = true }
maplecode-terminal-detection = { workspace = true }
maplecode-thread-store = { workspace = true }
maplecode-tui = { workspace = true }
maplecode-utils-absolute-path = { workspace = true }
maplecode-utils-path = { workspace = true }
maplecode-utils-path-uri = { workspace = true }
maplecode-utils-redacted-string = { workspace = true }
maplecode-websocket-auth = { workspace = true }
crossterm = { workspace = true, features = ["event-stream"] }
futures = { workspace = true }
http = { workspace = true }
libc = { workspace = true }
os_info = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
supports-color = { workspace = true }
sys-locale = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "time",
] }
toml = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }
url = { workspace = true }
which = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(all(target_os = "linux", target_env = "musl", any(target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
tikv-jemallocator = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
maplecode_windows_sandbox = { package = "maplecode-windows-sandbox", path = "../windows-sandbox-rs" }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_Packaging_Appx",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[dev-dependencies]
app_test_support = { workspace = true }
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
maplecode-app-server-client = { workspace = true }
maplecode-uds = { workspace = true }
maplecode-utils-cargo-bin = { workspace = true }
maplecode-utils-pty = { workspace = true }
core_test_support = { workspace = true }
flate2 = { workspace = true }
insta = { workspace = true }
jsonwebtoken = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
sha2 = { workspace = true }
tar = { workspace = true }
tokio-tungstenite = { workspace = true }
vt100 = { workspace = true }
wiremock = { workspace = true }
zstd = { workspace = true }

[package.metadata.cargo-shear]
# These Rust sources are intentionally Bazel-only macrobenchmarks rather than
# Cargo targets.
ignored-paths = ["e2e_benches/*.rs"]
