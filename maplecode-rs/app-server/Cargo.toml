[package]
name = "maplecode-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "maplecode-app-server"
path = "src/main.rs"

[[bin]]
name = "maplecode-app-server-test-notify-capture"
path = "src/bin/notify_capture.rs"

[[bin]]
name = "exec-server"
path = "src/bin/exec_server.rs"

[lib]
name = "maplecode_app_server"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
maplecode-agent-message-board-host = { workspace = true }
maplecode-utils-process = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
maplecode-analytics = { workspace = true }
maplecode-app-server-daemon = { workspace = true }
maplecode-arg0 = { workspace = true }
maplecode-aws-auth = { workspace = true }
maplecode-cloud-config = { workspace = true }
maplecode-code-mode = { workspace = true }
maplecode-config = { workspace = true }
maplecode-network-proxy = { workspace = true }
maplecode-connectors = { workspace = true }
