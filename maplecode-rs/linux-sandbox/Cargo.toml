[package]
name = "maplecode-linux-sandbox"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "maplecode-linux-sandbox"
path = "src/main.rs"

[lib]
name = "maplecode_linux_sandbox"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
clap = { workspace = true, features = ["derive"] }
maplecode-install-context = { workspace = true }
maplecode-network-proxy = { workspace = true }
maplecode-process-hardening = { workspace = true }
maplecode-protocol = { workspace = true }
maplecode-sandboxing = { workspace = true }
maplecode-uds = { workspace = true }
maplecode-utils-absolute-path = { workspace = true }
ignore = { workspace = true }
indexmap = { workspace = true }
landlock = { workspace = true }
libc = { workspace = true }
rustix = { workspace = true }
seccompiler = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
url = { workspace = true }

[target.'cfg(target_os = "linux")'.dev-dependencies]
maplecode-core = { workspace = true }
maplecode-utils-cargo-bin = { workspace = true }
hickory-proto = "=0.26.3"
pretty_assertions = { workspace = true }
socks5-protocol = { version = "=0.3.5", features = ["sync"] }
tempfile = { workspace = true }
test-case = "3.3.1"
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
