[package]
edition.workspace = true
license.workspace = true
name = "maplecode-thread-store"
version.workspace = true

[lib]
name = "maplecode_thread_store"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
caseless = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
maplecode-app-server-protocol = { workspace = true }
maplecode-extension-items = { workspace = true }
maplecode-git-utils = { workspace = true }
maplecode-install-context = { workspace = true }
maplecode-otel = { workspace = true }
maplecode-protocol = { workspace = true }
maplecode-rollout = { workspace = true }
maplecode-state = { workspace = true }
maplecode-utils-absolute-path = { workspace = true }
maplecode-utils-path = { workspace = true }
maplecode-utils-path-uri = { workspace = true }
futures = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sqlx = { workspace = true }
sqlx-macros = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
maplecode-protocol-test-support = { workspace = true }
maplecode-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid = { workspace = true }
