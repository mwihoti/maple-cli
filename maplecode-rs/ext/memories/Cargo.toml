[package]
edition.workspace = true
license.workspace = true
name = "maplecode-memories-extension"
version.workspace = true

[lib]
name = "maplecode_memories_extension"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
maplecode-core = { workspace = true }
maplecode-extension-api = { workspace = true }
maplecode-features = { workspace = true }
maplecode-otel = { workspace = true }
maplecode-protocol = { workspace = true }
maplecode-tools = { workspace = true }
maplecode-utils-absolute-path = { workspace = true }
maplecode-utils-output-truncation = { workspace = true }
maplecode-utils-template = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
