[package]
edition.workspace = true
license.workspace = true
name = "maplecode-extension-api"
version.workspace = true

[lib]
name = "maplecode_extension_api"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
maplecode-core-plugin-common = { workspace = true }
maplecode-api = { workspace = true }
futures = { workspace = true }
maplecode-guardian-context = { workspace = true }
maplecode-history = { workspace = true }
maplecode-config = { workspace = true }
maplecode-context-fragments = { workspace = true }
maplecode-exec-server-protocol = { workspace = true }
maplecode-file-system = { workspace = true }
maplecode-mcp = { workspace = true }
maplecode-protocol = { workspace = true }
maplecode-tools = { workspace = true }
maplecode-utils-absolute-path = { workspace = true }
maplecode-utils-path-uri = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
