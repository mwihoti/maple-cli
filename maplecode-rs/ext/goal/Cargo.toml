[package]
edition.workspace = true
license.workspace = true
name = "maplecode-goal-extension"
version.workspace = true

[lib]
name = "maplecode_goal_extension"
path = "src/lib.rs"
test = false
doctest = false

[lints]
workspace = true

[dependencies]
maplecode-analytics = { workspace = true }
maplecode-core = { workspace = true }
maplecode-extension-api = { workspace = true }
maplecode-otel = { workspace = true }
maplecode-prompts = { workspace = true }
maplecode-protocol = { workspace = true }
maplecode-rollout = { workspace = true }
maplecode-state = { workspace = true }
maplecode-tools = { workspace = true }
maplecode-utils-template = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
maplecode-utils-absolute-path = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
