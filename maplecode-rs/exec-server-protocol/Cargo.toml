[package]
name = "maplecode-exec-server-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "maplecode_exec_server_protocol"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
maplecode-file-system = { workspace = true }
maplecode-install-context = { workspace = true }
maplecode-network-proxy = { workspace = true }
maplecode-protocol = { workspace = true }
maplecode-shell-command = { workspace = true }
maplecode-skills = { workspace = true }
maplecode-utils-path-uri = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["arbitrary_precision", "raw_value"] }

[target.'cfg(windows)'.dependencies]
maplecode-mxc-sandbox = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
