[package]
name = "maplecode-external-agent-migration"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false
name = "maplecode_external_agent_migration"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
chrono = { workspace = true }
maplecode-analytics = { workspace = true }
maplecode-config = { workspace = true }
maplecode-core = { workspace = true }
maplecode-core-plugins = { workspace = true }
maplecode-hooks = { workspace = true }
maplecode-login = { workspace = true }
maplecode-memories-write = { workspace = true }
maplecode-otel = { workspace = true }
maplecode-plugin = { workspace = true }
maplecode-protocol = { workspace = true }
maplecode-rollout = { workspace = true }
maplecode-thread-store = { workspace = true }
maplecode-utils-output-truncation = { workspace = true }
linkify = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }

[dev-dependencies]
maplecode-app-server-protocol = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
