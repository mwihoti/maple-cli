[package]
name = "maplecode-login"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
maplecode-utils-process = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
maplecode-agent-identity = { workspace = true }
maplecode-http-client = { workspace = true }
maplecode-config = { workspace = true }
maplecode-keyring-store = { workspace = true }
maplecode-model-provider-info = { workspace = true }
maplecode-otel = { workspace = true }
maplecode-protocol = { workspace = true }
maplecode-secrets = { workspace = true }
maplecode-terminal-detection = { workspace = true }
maplecode-utils-path = { workspace = true }
maplecode-utils-template = { workspace = true }
maplecode-workload-identity = { workspace = true }
http = { workspace = true }
oauth2 = { version = "5", default-features = false }
once_cell = { workspace = true }
os_info = { workspace = true }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tiny_http = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tracing = { workspace = true }
url = { workspace = true }
urlencoding = { workspace = true }
webbrowser = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[dev-dependencies]
maplecode-utils-cargo-bin = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
core_test_support = { workspace = true }
jsonwebtoken = { workspace = true }
keyring = { workspace = true }
pretty_assertions = { workspace = true }
regex-lite = { workspace = true }
serial_test = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }

[lib]
doctest = false
