[package]
name = "maplecode-app-server-transport"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "maplecode_app_server_transport"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
maplecode-http-client = { workspace = true }
maplecode-websocket-client = { workspace = true }
axum = { workspace = true, default-features = false, features = [
    "http1",
    "json",
    "tokio",
    "ws",
] }
base64 = { workspace = true }
maplecode-api = { workspace = true }
maplecode-app-server-protocol = { workspace = true }
maplecode-core = { workspace = true }
maplecode-features = { workspace = true }
maplecode-login = { workspace = true }
maplecode-model-provider = { workspace = true }
maplecode-protocol = { workspace = true }
maplecode-runtime-agent-instance = { workspace = true }
maplecode-state = { workspace = true }
maplecode-uds = { workspace = true }
maplecode-utils-absolute-path = { workspace = true }
maplecode-utils-rustls-provider = { workspace = true }
maplecode-websocket-auth = { workspace = true }
futures = { workspace = true }
gethostname = { workspace = true }
httpdate = { workspace = true }
owo-colors = { workspace = true, features = ["supports-colors"] }
rand = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
time = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
] }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["log"] }
url = { workspace = true }
uuid = { workspace = true, features = ["serde", "v7"] }
zstd = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }
signal-hook = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
core_test_support = { workspace = true }
wiremock = { workspace = true }
chrono = { workspace = true }
maplecode-config = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
