[package]
edition.workspace = true
license.workspace = true
name = "maplecode-memories-write"
version.workspace = true

[lib]
name = "maplecode_memories_write"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
maplecode-backend-client = { workspace = true }
maplecode-core = { workspace = true }
maplecode-config = { workspace = true }
maplecode-features = { workspace = true }
maplecode-git-utils = { workspace = true }
maplecode-login = { workspace = true }
maplecode-model-provider = { workspace = true }
maplecode-otel = { workspace = true }
maplecode-protocol = { workspace = true }
maplecode-rollout = { workspace = true }
maplecode-rollout-trace = { workspace = true }
maplecode-secrets = { workspace = true }
maplecode-state = { workspace = true }
maplecode-terminal-detection = { workspace = true }
maplecode-utils-absolute-path = { workspace = true }
maplecode-utils-output-truncation = { workspace = true }
maplecode-utils-template = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing = { workspace = true, features = ["log"] }
uuid = { workspace = true, features = ["v4", "v5"] }

[dev-dependencies]
base64 = { workspace = true }
maplecode-runtime-agent-instance = { workspace = true }
maplecode-model-provider-info = { workspace = true }
maplecode-models-manager = { workspace = true }
core_test_support = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros"] }
wiremock = { workspace = true }
